plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.jabheh.sharghi'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.jabheh.sharghi'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
}
