name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix resource file names
        run: |
          cd app/src/main/res/drawable
          for f in *.png.jpg *.png.jpeg; do
            [ -e "$f" ] || continue
            n="${f%.jpg}"
            n="${n%.jpeg}"
            mv "$f" "$n"
          done
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk JabheShargh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JabheShargh-APK
          path: JabheShargh.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest JabheShargh.apk --title "JabheShargh" --notes "Latest build" --target ${{ github.sha }}
